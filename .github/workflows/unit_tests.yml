name: unit_tests

on:
  pull_request:
    branches:
      - trunk
  push:
    branches: [ "trunk" ]

jobs:
  UnitTests:
    name: Run unit tests on PR in trunk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: 22
      - name: Run unit tests
        run: ./gradlew test