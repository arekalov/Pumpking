name: Base CI

on:
  pull_request:
    branches: [ "trunk" ]

  workflow_dispatch:

jobs:
  base-ci-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 22
        uses: actions/setup-java@v1
        with:
          java-version: 22

      - name: Run detekt liter
        run: ./gradlew detekt

      - name: Run unit tests
        run: ./gradlew test

      - name: Build with Gradle
        run: ./gradlew build
